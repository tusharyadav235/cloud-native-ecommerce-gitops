apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # Change to your actual AWS region
      # Authentication options:
      # If running on EKS with IAM Roles for Service Accounts (IRSA):
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa # The service account with the IAM role attached
