apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-app-dev
  namespace: argocd
spec:
  project: default
  source:
    # IMPORTANT: Update this to your NEW GitOps repository URL
    repoURL: 'https://github.com/your-username/gitops.git'
    targetRevision: HEAD
    path: k8s/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ecommerce-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---

