apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-dev-2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tusharyadav235/cloud-native-ecommerce-gitops.git
    targetRevision: main
    path: overlays/dev   # <-- Fixed path for Dev
  destination:
    server: https://kubernetes.default.svc
    namespace: development
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tusharyadav235/cloud-native-ecommerce-gitops.git
    targetRevision: main
    path: overlays/prod   # <-- New Application pointing to Prod
  destination:
    server: https://kubernetes.default.svc
    namespace: production 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

